# Port of the retired fail2ban [yunohost-portal] jail to CrowdSec, rewritten
# for Caddy's access-log format (nginx is retired; see
# docs/CROWDSEC-MIGRATION.md P1).
#
# The retired fail2ban filter matched a single line:
#   ^<HOST> -.*"POST /yunohost/portalapi/login HTTP/\d.\d" 401
#
# Same approach as nostrhost/yunohost-auth-bf: reproduce the fail2ban path
# match directly on the metas set by crowdsecurity/caddy-logs + http-logs,
# so no custom parser is needed.
#
# fail2ban semantics ported:
#   maxretry = 20   (jail overrides [DEFAULT] maxretry 10) -> capacity
#   findtime = 10m  ([DEFAULT])                            -> leakspeed =
#                                                              600s / 20 = 30s
#   bantime  = 10m  ([DEFAULT])                            -> decision duration
#                                                              set by bouncer (P4)
#
# The portal login is rate-limited more leniently (20 failures) than the web
# API jail (10), mirroring the original fail2ban overrides.
type: leaky
name: nostrhost/yunohost-portal-auth-bf
description: "Detect brute force against the YunoHost SSO portal login (POST /yunohost/portalapi/login)"
filter: |
  evt.Meta.log_type == 'http_access-log'
  && evt.Meta.http_verb == 'POST'
  && evt.Meta.http_path == '/yunohost/portalapi/login'
  && evt.Meta.http_status == '401'
groupby: evt.Meta.source_ip
capacity: 20
leakspeed: "30s"
blackhole: 1m
labels:
  service: http
  type: bf
  remediation: true