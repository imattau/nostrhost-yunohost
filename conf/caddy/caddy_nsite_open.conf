# Caddy per-domain snippet for the nsite gateway origin in OPEN mode (Phase 5),
# tracked by regenconf (category: caddy).
#
# Open mode serves any decodable `*.{{ domain }}` label, so it uses one
# wildcard certificate issued via DNS-01 instead of On-Demand TLS per-name
# issuance. The DNS provider and the operator's ACME DNS API token come from
# /etc/nostrhost/operator.toml (acme_dns_provider / acme_dns_api_token); the
# snippet references the token only through Caddy env substitution ({$...}),
# and the fork refuses open mode when the token is absent. `{{ provider }}` is
# substituted at render time. Routing is still reconciled as the managed
# `nostrhost-nsite:{{ domain }}` admin route; this file carries the site-level
# TLS/log/header directives and lets regenconf detect manual edits.
{{ domain }}, *.{{ domain }} {
	log
	tls {
		dns {{ provider }} {$ACME_DNS_API_TOKEN}
	}
	header {
		-Server
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
		Cross-Origin-Opener-Policy same-origin
	}
	reverse_proxy 127.0.0.1:8195 {
		header_up X-Forwarded-Host {host}
	}
}