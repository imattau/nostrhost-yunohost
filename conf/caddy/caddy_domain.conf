# Caddy per-domain snippet tracked by regenconf (category: caddy).
#
# Actual web routing is reconciled through the Caddy admin API (native
# `web.route` resources and `nostrhost-domain:<domain>` sites); this tracked
# file guarantees a minimal root response and lets regenconf detect manual
# modifications, mirroring the retired `15-nginx` category. The active
# Caddyfile imports `/etc/caddy/conf.d/*.conf`.
{{ domain }} {
	# Enables request/access logging for this site; the base Caddyfile's
	# global `log` block collects every site's access logger into
	# /var/log/caddy/access.log for CrowdSec's caddy-logs parser.
	log
	# YunoHost control-plane backends (mirrors the retired nginx location
	# blocks; see docs/CADDY-MIGRATION.md §5). `handle_path` strips the
	# /yunohost/... prefix exactly like nginx's trailing-slash proxy_pass.
	handle_path /yunohost/api/* {
		reverse_proxy 127.0.0.1:6787
	}
	handle_path /yunohost/portalapi/* {
		reverse_proxy 127.0.0.1:6788
	}
	# User portal SPA (built to /usr/share/nostrhost/portal with baseURL
	# /yunohost/sso); `handle_path` strips the prefix (nginx alias semantics)
	# and `try_files` falls back to index.html for client-side routes.
	handle_path /yunohost/sso/* {
		root * /usr/share/nostrhost/portal
		try_files {path} {path}/ /index.html
		file_server
	}
	# Admin SPA (built to /usr/share/nostrhost/admin with base /yunohost/admin).
	handle_path /yunohost/admin/* {
		root * /usr/share/nostrhost/admin
		try_files {path} {path}/ /index.html
		file_server
	}
	handle {
		respond "nostrhost domain {{ domain }}" 200
	}
}