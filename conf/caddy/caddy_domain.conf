# Caddy per-domain snippet tracked by regenconf (category: caddy).
#
# Actual web routing is reconciled through the Caddy admin API (native
# `web.route` resources and `nostrhost-domain:<domain>` sites); this tracked
# file guarantees a minimal root response and lets regenconf detect manual
# modifications, mirroring the retired `15-nginx` category. The active
# Caddyfile imports `/etc/caddy/conf.d/*.conf`.
{{ domain }} {
	# Enables request/access logging for this site; the base Caddyfile's
	# global `log` block collects every site's access logger into
	# /var/log/caddy/access.log for CrowdSec's caddy-logs parser.
	log
	# External trust by default: non-special-use domains leave TLS to Caddy's
	# automatic HTTPS (ACME provisioning for public names), so real
	# certificates are served without any per-domain setup. Only special-use
	# TLDs (.test/.local/.localhost/.internal/.home.arpa/.onion) cannot be ACME
	# validated and fall back to Caddy's internal CA. The renderers set the
	# `tls_internal` Jinja var (mirroring `native_api`) from
	# yunohost.utils.dns.is_special_use_tld.
	{% if tls_internal %}
	tls internal
	{% endif %}
	# NostrHost control-plane backends (mirrors the retired nginx location
	# blocks; see docs/CADDY-MIGRATION.md §5). `handle_path` strips the
	# /nostrhost/... prefix exactly like nginx's trailing-slash proxy_pass.
	# The bare /nostrhost/sso|admin forms 301 to the trailing-slash path so
	# they reach the SPA instead of the root responder (nginx's
	# `rewrite ^/yunohost/sso$ /yunohost/sso/ permanent;`).
	redir /nostrhost/sso /nostrhost/sso/ permanent
	redir /nostrhost/admin /nostrhost/admin/ permanent
	handle_path /nostrhost/api/* {
		reverse_proxy 127.0.0.1:6787
	}
	handle_path /nostrhost/portalapi/* {
		reverse_proxy 127.0.0.1:6788
	}
	# Native control-plane API (the admin console's /package/* surface,
	# src/nostrhost/api.py on 127.0.0.1:8190).
	#
	# SECURITY (H4): /package/* is the admin surface and is routed ONLY on the
	# primary admin domain — never on app subdomains — so a subdomain app XSS
	# can never reach the admin API. The renderers set `native_api` for the
	# primary domain only (mirroring caddy_admin.build_portal_routes /
	# DomainService._expose_native_api, which expose it through the Caddy
	# admin API); app subdomains render the snippet without the proxy block.
	{% if native_api %}
	handle /package/* {
		reverse_proxy 127.0.0.1:8190
	}
	{% endif %}
	# User portal SPA (built to /usr/share/nostrhost/portal with baseURL
	# /nostrhost/sso); `handle_path` strips the prefix (nginx alias semantics)
	# and `try_files` falls back to index.html for client-side routes.
	#
	# App logos (advertised at /nostrhost/sso/applogos/<hash>.png by
	# app.py / nostrhost.permissions) live outside the portal build dir at
	# /usr/share/yunohost/applogos. Upstream nginx aliased this path; the
	# nginx->Caddy cutover dropped it, so this handler MUST precede the SPA
	# handler or logo requests hit `try_files` and receive index.html.
	handle_path /nostrhost/sso/applogos/* {
		root * /usr/share/yunohost/applogos
		file_server
		header Cache-Control "max-age=2629746, public"
	}
	handle_path /nostrhost/sso/* {
		root * /usr/share/nostrhost/portal
		try_files {path} {path}/ /index.html
		file_server
	}
	# Admin SPA (built to /usr/share/nostrhost/admin with base /nostrhost/admin).
	handle_path /nostrhost/admin/* {
		root * /usr/share/nostrhost/admin
		try_files {path} {path}/ /index.html
		file_server
	}
	handle {
		respond "nostrhost domain {{ domain }}" 200
	}
}