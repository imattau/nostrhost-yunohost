# Caddy per-domain snippet for the nsite gateway origin, tracked by regenconf
# (category: caddy).
#
# The gateway domain gets THIS snippet instead of the standard caddy_domain.conf
# so it never serves Admin/Portal/API paths on the public site origin (§3.1,
# §3.3). Routing is reconciled as the managed `nostrhost-nsite:<domain>` admin
# route; this file carries the site-level TLS/log/header directives and lets
# regenconf detect manual edits. On-Demand TLS asks the gateway's loopback
# /internal/tls-ask before issuance; with the gateway stopped the endpoint is
# unreachable and Caddy refuses issuance (safe failure, §3.3).
{{ domain }}, *.{{ domain }} {
	log
	tls {
		on_demand
	}
	header {
		-Server
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
		Cross-Origin-Opener-Policy same-origin
	}
	reverse_proxy 127.0.0.1:8195 {
		header_up X-Forwarded-Host {host}
	}
}