[project]
name = "yunohost"
description = "An operating system aiming to simplify as much as possible the administration of a server"
readme = "README.md"
dynamic = ["version"]
authors = [
    { name = "YunoHost", email = "yunohost@yunohost.org" }
]

requires-python = ">=3.11"

# These dependencies might not be up to date, please see debian/control instead
dependencies = [
    # NostrHost derivative identity layer (roadmap §4 / Phase 3):
    # nostr-identity / nostr-identityd author and project identity events on
    # the local control relay (kind 31102) over raw NIP-01 WebSocket.
    "nostrhost-auth @ git+https://github.com/imattau/nostrhost-auth@main",
    # Shared authorization/policy rules used by the native resource-engine
    # execution boundary (free-space, backup, and owner approval tiers).
    "nostrhost-policy @ git+https://github.com/imattau/nostrhost-policy@main",
    "nostr-sdk>=0.45.1",
    # >=14.2 required: websockets 13.x sync client races receive_eof() in
    # close_socket() without the protocol mutex (python-websockets e7a098e,
    # fixed in 14.2), so an abruptly-dropped relay connection raises
    # `AssertionError: assert self.protocol.state is CLOSED` in the internal
    # recv_events thread and wedges operationsd.
    "websockets>=14.2",
    # Native HTTP APIs: the admin API is FastAPI/uvicorn (ASGI); bottle is
    # still used by the portal-auth API until it is migrated too.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "bottle",
    "cryptography",
    # "dbus-python",
    "python-debian",
    "dnspython",
    "email-validator",
    "jinja2",
    # HTTP client for the native providers/DNS. Replaces the previously
    # undeclared `httpx` (nothing provided that module) — the runtime venv
    # bundles httpx2 (via the MCP SDK), so use it directly.
    "httpx2>=2",
    "psycopg[binary]",
    "pymysql",
    "pyjwt>=2.0",
    "lexicon",
    "miniupnpc",
    "packaging",
    # Fallback only: shadow sha512crypt is generated with the stdlib `crypt`
    # on Python <=3.12 (see utils/password.py); passlib covers 3.13+, where
    # PEP 594 removed `crypt`, until a libxcrypt/yescrypt binding is adopted.
    "passlib",
    "psutil",
    "publicsuffix2",
    "pydantic>=2.0",
    "pyopenssl",
    # "python-ldap",
    "python-magic",
    "pyyaml",
    # Retained until the vendored acme_tiny ACME client is replaced/removed
    # (it imports requests); the rest of the tree is migrating to httpx2.
    "requests",
    "sdbus",
    "sortedcollections",
    # TOML writing; reads use the stdlib `tomllib` (Python >=3.11).
    "tomli-w",
    "typer>=0.7",
    "zeroconf",
    "zmq",
]

[dependency-groups]
tests = [
    "mypy",
    "ruff",
    "types-gevent",
    "types-passlib",
    "types-psutil",
    "types-pyOpenSSL",
    "types-pyYAML",
    "types-requests",
    "pytest",
    "mock",
]

[tool.mypy]
follow_imports = "skip"
exclude = [
    "acme_tiny",
    "migrations",
    "tests",
]

[[tool.mypy.overrides]]
# The fork's own package: `src/*` becomes `yunohost.*` only at install time,
# so a source-tree mypy run cannot see it as a package.
module = "yunohost.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# nostrhost-auth ships without type hints
module = ["nostrhost_auth.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Those are the public, external modules that don't provide typing
module = ["jwt", "sortedcollections", "IPython", "ldap.*", "dbus", "sdbus.*",
    "psutil", "bottle", "miniupnpc", "lexicon.*", "publicsuffix2"]
ignore_missing_imports = true


[tool.ruff]
target-version = "py311"
# Matches the scope the previous flake8 run covered. The tree is not yet
# `ruff format`-clean (the auto-format workflow handles formatting on the dev
# branch), so ruff here is the linter only.
exclude = ["src/vendor", "src/migrations", "tests", "tests_nostr"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501 (line length) and E402 (imports not at top) were dropped by the old
# flake8 config; E741 is kept off for the same reason. W503/E203 are handled by
# the formatter and no longer exist as ruff lint rules.
ignore = ["E402", "E501", "E741"]

[tool.ty]
environment.root = ["."]


[tool.pytest.ini_options]
# for --cov-config see https://github.com/nedbat/coveragepy/issues/512
addopts = "-v --cov-config=pyproject.toml"
norecursedirs = ["dist", "doc", "build", ".tox", ".eggs"]
testpaths = ["tests_nostr/"]
markers = [
    "with_system_archive_from_3p8",
    "with_backup_recommended_app_installed",
    "clean_opt_dir",
    "with_wordpress_archive_from_3p8",
    "with_legacy_app_installed",
    "with_backup_recommended_app_installed_with_ynh_restore",
    "with_permission_app_installed",
    "other_domains",
    "with_custom_domain",
]
filterwarnings = [
    "ignore::urllib3.exceptions.InsecureRequestWarning",
]


[tool.coverage.run]
relative_files = true
branch = true
source = ["src/"]

[tool.coverage.report]
omit = [
    "src/vendor/*",
    "/usr/lib/python3/dist-packages/yunohost/vendor/*",
]


[tool.tox]
env_list = ["py311-lint", "py311-mypy", "py311-format"]

[tool.tox.env_run_base]
skip_install = true

[tool.tox.env.py311-lint]
deps = ["ruff"]
commands = [["ruff", "check", "src", "bin", "doc", "maintenance"]]

[tool.tox.env.py311-format]
deps = ["ruff"]
commands = [["ruff", "format", "--check", "--diff", "src", "bin", "doc", "maintenance", "tests", "tests_nostr"]]

[tool.tox.env.py311-mypy]
skip_install = false
deps = ["mypy>=1.17"]
dependency_groups = ["tests"]
commands = [["mypy", "--install-types", "--non-interactive", "src/",]]
